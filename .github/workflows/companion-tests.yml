name: Companion API offline tests

on:
  push:
    branches: [companion-api]
  pull_request:
    branches: [companion-api]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q bg3data/companion
